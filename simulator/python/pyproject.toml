[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "industriepulse-simulator"
version = "0.1.0"
description = "Deterministic industrial telemetry simulator for IndustriePulse"
requires-python = ">=3.12"
dependencies = [
    "azure-eventhub>=5,<6",
    "azure-storage-blob>=12.30,<13",
    "fastavro>=1.12,<2"
]

[project.scripts]
industriepulse-sim = "industriepulse_simulator.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=9,<10"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
